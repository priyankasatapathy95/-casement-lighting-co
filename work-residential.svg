<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t1 d1" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t1">Residential living room with layered warm lighting</title>
  <desc id="d1">Abstract illustration of a living room showing a pendant light, a floor lamp, and warm wall wash lighting</desc>
  <rect width="400" height="300" fill="#211C17"/>
  <defs>
    <radialGradient id="g1" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#F6DFAE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#F6DFAE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="35%">
      <stop offset="0%" stop-color="#E8C48A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#E8C48A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g1)"/>
  <rect width="400" height="300" fill="url(#g2)"/>
  <!-- pendant light -->
  <line x1="150" y1="0" x2="150" y2="70" stroke="#4A3B2A" stroke-width="2"/>
  <ellipse cx="150" cy="80" rx="22" ry="10" fill="#3A2E22" stroke="#C79A56" stroke-width="2"/>
  <!-- floor lamp -->
  <line x1="320" y1="300" x2="320" y2="160" stroke="#4A3B2A" stroke-width="3"/>
  <path d="M300 160 L340 160 L332 130 L308 130 Z" fill="#3A2E22" stroke="#C79A56" stroke-width="2"/>
  <!-- floor line -->
  <line x1="0" y1="260" x2="400" y2="260" stroke="#3A2E22" stroke-width="1"/>
</svg>
