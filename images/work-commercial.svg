<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Retail storefront with track lighting</title>
  <desc id="d2">Abstract illustration of a retail space with a row of track spotlights highlighting a display wall</desc>
  <rect width="400" height="300" fill="#1B1815"/>
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A231B"/>
      <stop offset="100%" stop-color="#1B1815"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#F6DFAE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F6DFAE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#g3)"/>
  <line x1="40" y1="30" x2="360" y2="30" stroke="#4A3B2A" stroke-width="3"/>
  <g>
    <circle cx="90" cy="32" r="8" fill="#3A2E22" stroke="#C79A56" stroke-width="2"/>
    <circle cx="200" cy="32" r="8" fill="#3A2E22" stroke="#C79A56" stroke-width="2"/>
    <circle cx="310" cy="32" r="8" fill="#3A2E22" stroke="#C79A56" stroke-width="2"/>
  </g>
  <rect x="0" y="30" width="400" height="270" fill="url(#spot)"/>
  <rect x="60" y="120" width="80" height="120" fill="#241E18" stroke="#3A2E22"/>
  <rect x="170" y="100" width="80" height="140" fill="#241E18" stroke="#3A2E22"/>
  <rect x="280" y="130" width="80" height="110" fill="#241E18" stroke="#3A2E22"/>
</svg>
